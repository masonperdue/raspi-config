upstreams:
    init:
        strategy: blocking
    groups:
      default:
        - 127.0.0.1:5335
    strategy: strict
    timeout: 2s

connectIPVersion: v4

blocking:
    denylists:
        ads:
            - /app/denylists/blocklist.txt
            - https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn/hosts
    allowlists:
        ads:
            - /app/allowlists/allowlist.txt
    clientGroupsBlock:
        default:
            - ads
    blockType: zeroIP
    blockTTL: 1h
    loading:
        refreshPeriod: 24h
        downloads:
          timeout: 60s
          writeTimeout: 60s
          readTimeout: 60s
          readHeaderTimeout: 60s
          attempts: 3
          cooldown: 500ms
          cachePath: /app/cache
        concurrency: 4
        strategy: blocking
        maxErrorsPerSource: 5

caching:
    minTime: 5m
    maxTime: 0
    maxItemsCount: 0
    prefetching: true

rebindingProtection:
    enable: true

rateLimit:
    enable: true
    rate: 100
    burst: 200

ports:
    dns: 53

ede:
    enable: true

dnssec:
    validate: false
